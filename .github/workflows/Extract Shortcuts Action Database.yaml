name: Extract Shortcuts Action Database
on: workflow_dispatch

jobs:
  extract:
    runs-on: macos-26
    steps:
      - name: Check out repo (so the Mac has our script)
        uses: actions/checkout@v4

      - name: Record macOS version
        run: |
          mkdir -p out
          sw_vers | tee out/os-version.txt

      - name: Nudge Shortcuts to populate its databases
        run: |
          open -a Shortcuts 2>/dev/null || echo "Could not launch Shortcuts"
          sleep 25
          osascript -e 'tell application "Shortcuts" to quit' 2>/dev/null || true
        continue-on-error: true

      - name: Locate the ToolKit database
        run: |
          DB=$(find "$HOME/Library/Shortcuts/ToolKit" -name "Tools-active" 2>/dev/null | head -n 1)
          if [ -z "$DB" ]; then
            echo "::error::Tools-active not found — did the ToolKit path change again?"
            find "$HOME/Library/Shortcuts" 2>/dev/null | tee out/debug-tree.txt
            exit 1
          fi
          echo "Found: $DB"
          echo "DB_PATH=$DB" >> "$GITHUB_ENV"
          cp "$DB" out/toolkit-raw.db

      - name: Build condensed reference
        run: python3 scripts/build_reference.py "$DB_PATH" out/actions-condensed.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: action-database
          path: out/
          if-no-files-found: warn
